[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-token-distribution-concentration"
version = "0.1.0"
description = "Measure token ownership inequality, concentration and minimal coalition sizes for declared voting thresholds."
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
crypto-token-distribution-concentration = "cryptolab:main"

[tool.setuptools.packages.find]
include = ["cryptolab*"]

[tool.setuptools.package-data]
cryptolab = ["web/*"]
